{% extends "base.html" %}

{% block title %}Ventas - Verdulería App{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/css/ventas.css">
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Registro de Ventas</h1>
</div>

<div id="ventaMensaje" class="alert" style="display: none;"></div>

<div class="row g-4">
    <!-- Catálogo de Productos -->
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 mb-3 bg-light">
            <div class="card-body py-3">
                <div class="row g-2">
                    <div class="col-md-8">
                        <input type="text" class="form-control form-control-lg" id="searchProducto" placeholder="Buscar producto por nombre o código...">
                    </div>
                    <div class="col-md-4">
                        <select class="form-select form-select-lg" id="categoriaVentaFilter">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="listaProductos">
            <!-- Se llena con JS -->
        </div>
    </div>

    <!-- Carrito de Compras -->
    <div class="col-lg-4">
        <div class="card shadow-sm border-0 carrito-container">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0"><i class="bi bi-cart3 me-2"></i>Carrito</h5>
            </div>
            <div class="card-body d-flex flex-column">
                
                <div class="carrito-items mb-3" id="carritoItems">
                    <!-- Se llena con JS -->
                </div>

                <div class="mt-auto">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Cliente (Opcional)</label>
                        <input type="text" class="form-control" id="clienteNombre" placeholder="Consumidor Final">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Método de Pago</label>
                        <select class="form-select" id="metodoPago">
                            <option value="efectivo">Efectivo</option>
                            <option value="tarjeta">Tarjeta</option>
                            <option value="transferencia">Transferencia</option>
                        </select>
                    </div>

                    <div class="carrito-total mb-3">
                        Total: $<span id="totalCarrito">0.00</span>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-success btn-lg" id="btnFinalizarVenta" disabled>
                            <i class="bi bi-check-circle me-2"></i>Cobrar Venta
                        </button>
                        <button class="btn btn-outline-secondary" id="btnCancelarVenta">
                            Cancelar
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/js/ventas.js"></script>
{% endblock %}
