{% extends "base.html" %}

{% block title %}Reporte General - Verdulería App{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/css/reporte.css">
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Reporte General de Asistencias</h1>
</div>

<!-- Barra de Filtros -->
<div class="filters-bar">
    <div class="row g-3 align-items-end">
        <div class="col-md-3">
            <label class="form-label text-muted small">Desde</label>
            <input type="date" class="form-control" id="fechaDesde">
        </div>
        <div class="col-md-3">
            <label class="form-label text-muted small">Hasta</label>
            <input type="date" class="form-control" id="fechaHasta">
        </div>
        <div class="col-md-3">
            <label class="form-label text-muted small">Empleado</label>
            <select class="form-select" id="empleadoId">
                <option value="">Todos los empleados</option>
                <!-- Se llena con JS -->
            </select>
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary w-100" id="filtrarBtn">
                <i class="bi bi-search me-1"></i> Filtrar
            </button>
            <button class="btn btn-outline-secondary w-100 mt-2" id="limpiarBtn">
                <i class="bi bi-x-circle me-1"></i> Limpiar Filtros
            </button>
        </div>
    </div>
</div>

<!-- Tabla de Resultados -->
<div class="table-responsive">
    <table class="table table-hover align-middle" id="reporteTable">
        <thead class="table-light">
            <tr>
                <th>Empleado</th>
                <th>Fecha</th>
                <th>Entrada</th>
                <th>Salida</th>
                <th>Horas</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <!-- Se llena con JS -->
        </tbody>
    </table>
</div>
{% endblock %}

{% block extra_js %}
<script src="/js/reporte.js"></script>
{% endblock %}
