{% extends "base.html" %}

{% block title %}Empleados - Verdulería App{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/css/empleados.css">
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Gestión de Empleados</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <button class="btn btn-primary shadow-sm" id="btnNuevoEmpleado" style="display: none;">
            <i class="bi bi-person-plus me-2"></i>Nuevo Empleado
        </button>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-hover align-middle" id="empleadosTable">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Empleado</th>
                <th>DNI</th>
                <th>Rol</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Se llena con JS -->
        </tbody>
    </table>
</div>

<!-- Modal para Crear/Editar -->
<div class="modal fade" id="empleadoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-light border-0">
                <h5 class="modal-title fw-bold" id="empleadoModalTitle">Nuevo Empleado</h5>
                <button type="button" class="btn-close" id="btnCancelarEmpleado" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="empleadoForm">
                    <input type="hidden" id="empleadoId">
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted">Nombre</label>
                            <input type="text" class="form-control" id="empNombre" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted">Apellido</label>
                            <input type="text" class="form-control" id="empApellido" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted">DNI</label>
                        <input type="text" class="form-control" id="empDni" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted">Correo Electrónico</label>
                        <input type="email" class="form-control" id="empEmail" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted">Rol asignado</label>
                        <select class="form-select" id="empRol" required>
                            <option value="empleado">Empleado</option>
                            <option value="supervisor">Supervisor</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-light" id="btnCancelarEmpleado">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Empleado</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/js/empleados.js"></script>
{% endblock %}
