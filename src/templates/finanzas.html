<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas - Verdulería App</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .dashboard-financiero {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            flex: 1;
            min-width: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .card.ingresos { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .card.egresos { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .card.balance { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .card h3 { font-size: 28px; margin: 10px 0; }
        .filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .gastos-table {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Panel Financiero</h1>
            <div class="nav">
                <a href="/dashboard.html">Inicio</a>
                <a href="/empleados.html">Empleados</a>
                <a href="/asistencias.html">Asistencias</a>
                <a href="/stock.html">Stock</a>
                <a href="/ventas.html">Ventas</a>
                <a href="/horarios.html">Horarios</a>
                <a href="/finanzas.html">Finanzas</a>
                <a href="#" id="reporteLink" style="display: none;">Reportes</a>
                <a href="#" id="logoutBtn">Cerrar Sesión</a>
            </div>
        </div>
        <div class="content">
            <div class="filtros">
                <label>Período:</label>
                <select id="periodo">
                    <option value="diario">Diario</option>
                    <option value="semanal">Semanal</option>
                    <option value="mensual" selected>Mensual</option>
                    <option value="anual">Anual</option>
                    <option value="personalizado">Personalizado</option>
                </select>
                <input type="date" id="fechaInicio" style="display: none;">
                <input type="date" id="fechaFin" style="display: none;">
                <button id="btnFiltrar">Actualizar</button>
            </div>
            
            <div class="dashboard-financiero" id="dashboardCards"></div>
            
            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px;">
                <div style="flex: 1; min-width: 300px;">
                    <h3>Distribución de Gastos</h3>
                    <canvas id="gastosChart" width="300" height="200"></canvas>
                </div>
                <div style="flex: 2;">
                    <h3>Ingresos vs Egresos</h3>
                    <canvas id="ingresosEgresosChart" width="400" height="200"></canvas>
                </div>
            </div>
            
            <div class="gastos-table">
                <h3>📝 Gastos Generales</h3>
                <button id="btnNuevoGasto" class="success" style="margin-bottom: 10px;">+ Nuevo Gasto</button>
                <table id="gastosTable">
                    <thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Monto</th><th>Acciones</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Modal para nuevo gasto -->
    <div id="gastoModal" class="modal">
        <div class="modal-content">
            <h3>Registrar Gasto</h3>
            <form id="gastoForm">
                <div class="form-group"><label>Concepto:*</label><input type="text" id="gastoConcepto" required></div>
                <div class="form-group"><label>Descripción:</label><textarea id="gastoDescripcion"></textarea></div>
                <div class="form-group"><label>Monto:*</label><input type="number" step="0.01" id="gastoMonto" required></div>
                <div class="form-group"><label>Fecha:*</label><input type="date" id="gastoFecha" required></div>
                <div class="form-group"><label>Categoría:</label>
                    <select id="gastoCategoria">
                        <option value="operativo">Operativo</option>
                        <option value="servicios">Servicios (luz, agua, internet)</option>
                        <option value="alquiler">Alquiler</option>
                        <option value="mantenimiento">Mantenimiento</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>
                <div class="form-group"><label>Comprobante:</label><input type="text" id="gastoComprobante" placeholder="Nº factura o referencia"></div>
                <div class="modal-buttons">
                    <button type="submit">Guardar</button>
                    <button type="button" id="btnCancelarGasto">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/js/api.js"></script>
    <script>
        const rol = getUserRol();
        let gastosChart = null;
        let ingresosEgresosChart = null;
        
        if (rol === 'admin' || rol === 'supervisor') {
            document.getElementById('reporteLink').style.display = 'inline';
            document.getElementById('reporteLink').href = '/reporte.html';
        }
        
        document.getElementById('periodo').addEventListener('change', () => {
            const periodo = document.getElementById('periodo').value;
            const fechaInicio = document.getElementById('fechaInicio');
            const fechaFin = document.getElementById('fechaFin');
            if (periodo === 'personalizado') {
                fechaInicio.style.display = 'inline';
                fechaFin.style.display = 'inline';
            } else {
                fechaInicio.style.display = 'none';
                fechaFin.style.display = 'none';
            }
        });
        
        async function loadResumen() {
            let periodo = document.getElementById('periodo').value;
            let url = '/finanzas/resumen?';
            
            if (periodo === 'personalizado') {
                const fechaInicio = document.getElementById('fechaInicio').value;
                const fechaFin = document.getElementById('fechaFin').value;
                if (fechaInicio && fechaFin) {
                    url += `fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`;
                } else {
                    alert('Seleccione fechas de inicio y fin');
                    return;
                }
            } else {
                url += `periodo=${periodo}`;
            }
            
            try {
                const result = await apiRequest(url);
                const data = result.data;
                
                document.getElementById('dashboardCards').innerHTML = `
                    <div class="card ingresos">
                        <h4>💰 Ingresos</h4>
                        <h3>$${data.ingresos.total.toFixed(2)}</h3>
                        <small>${data.ingresos.cantidad_ventas} ventas | Promedio $${data.ingresos.ticket_promedio}</small>
                    </div>
                    <div class="card egresos">
                        <h4>📉 Egresos</h4>
                        <h3>$${data.egresos.total.toFixed(2)}</h3>
                        <small>Sueldos: $${data.egresos.sueldos.toFixed(2)} | Compras: $${data.egresos.compras_proveedores.toFixed(2)} | Gastos: $${data.egresos.gastos_generales.toFixed(2)}</small>
                    </div>
                    <div class="card balance">
                        <h4>⚖️ Balance</h4>
                        <h3>$${data.balance.toFixed(2)}</h3>
                        <small>Margen: ${data.margen_ganancia}%</small>
                    </div>
                `;
                
                // Actualizar gráfico de gastos
                const categorias = data.egresos.detalle_gastos || [];
                if (gastosChart) gastosChart.destroy();
                const ctx = document.getElementById('gastosChart').getContext('2d');
                gastosChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: categorias.map(c => c.categoria),
                        datasets: [{ data: categorias.map(c => c.total_gastos), backgroundColor: ['#3498db', '#e74c3c', '#f39c12', '#27ae60', '#9b59b6'] }]
                    }
                });
                
                // Gráfico simple de ingresos vs egresos
                if (ingresosEgresosChart) ingresosEgresosChart.destroy();
                const ctx2 = document.getElementById('ingresosEgresosChart').getContext('2d');
                ingresosEgresosChart = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: ['Ingresos', 'Egresos'],
                        datasets: [{ data: [data.ingresos.total, data.egresos.total], backgroundColor: ['#27ae60', '#e74c3c'] }]
                    }
                });
            } catch (error) {
                console.error('Error cargando resumen:', error);
            }
        }
        
        async function loadGastos() {
            try {
                const result = await apiRequest('/finanzas/gastos');
                const tbody = document.querySelector('#gastosTable tbody');
                tbody.innerHTML = '';
                result.data.forEach(g => {
                    const row = tbody.insertRow();
                    row.insertCell(0).textContent = g.fecha;
                    row.insertCell(1).textContent = g.concepto;
                    row.insertCell(2).textContent = g.categoria;
                    row.insertCell(3).textContent = `$${g.monto}`;
                    if (rol === 'admin') {
                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = 'Eliminar';
                        deleteBtn.className = 'danger';
                        deleteBtn.onclick = () => eliminarGasto(g.id);
                        row.insertCell(4).appendChild(deleteBtn);
                    } else {
                        row.insertCell(4).textContent = '-';
                    }
                });
            } catch (error) {
                console.error('Error cargando gastos:', error);
            }
        }
        
        async function eliminarGasto(id) {
            if (confirm('¿Eliminar este gasto?')) {
                try {
                    await apiRequest(`/finanzas/gastos/${id}`, 'DELETE');
                    loadGastos();
                    loadResumen();
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }
        }
        
        document.getElementById('btnNuevoGasto').addEventListener('click', () => {
            document.getElementById('gastoForm').reset();
            document.getElementById('gastoFecha').value = new Date().toISOString().split('T')[0];
            document.getElementById('gastoModal').style.display = 'flex';
        });
        
        document.getElementById('gastoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                concepto: document.getElementById('gastoConcepto').value,
                descripcion: document.getElementById('gastoDescripcion').value,
                monto: parseFloat(document.getElementById('gastoMonto').value),
                fecha: document.getElementById('gastoFecha').value,
                categoria: document.getElementById('gastoCategoria').value,
                comprobante: document.getElementById('gastoComprobante').value
            };
            try {
                await apiRequest('/finanzas/gastos', 'POST', data);
                document.getElementById('gastoModal').style.display = 'none';
                loadGastos();
                loadResumen();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
        
        document.getElementById('btnFiltrar').addEventListener('click', () => loadResumen());
        document.getElementById('btnCancelarGasto').addEventListener('click', () => document.getElementById('gastoModal').style.display = 'none');
        
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            logout();
        });
        
        loadResumen();
        loadGastos();
    </script>
</body>
</html>
