<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Verdulería App</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS Específico -->
    <link rel="stylesheet" href="/css/cambiar-password.css">
</head>
<body>

    <div class="card password-card">
        <div class="card-body">
            <div class="password-icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h3 class="text-center mb-2 fw-bold text-dark">Cambiar Contraseña</h3>
            <p class="text-center text-muted mb-4 small">Por seguridad, debes cambiar la contraseña asignada antes de continuar.</p>
            
            <form id="cambiarPasswordForm">
                <div class="mb-3">
                    <label class="form-label text-muted">Nueva Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="nueva_password" required minlength="6" placeholder="Mínimo 6 caracteres">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted">Confirmar Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-key-fill"></i></span>
                        <input type="password" class="form-control" id="confirmar_password" required placeholder="Repite la contraseña">
                    </div>
                </div>
                
                <div id="error" class="alert alert-danger d-none" role="alert"></div>
                <div id="success" class="alert alert-success d-none" role="alert"></div>
                
                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark" id="btnSubmit">
                    Actualizar Contraseña <i class="bi bi-shield-check ms-2"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/cambiar-password.js"></script>
</body>
</html>
