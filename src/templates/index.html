<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Verdulería App</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #f4f6f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: none;
        }
        .login-logo {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="card-body">
            <div class="login-logo">🥬</div>
            <h3 class="text-center mb-4 fw-bold text-success">Verdulería App</h3>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                </div>
                
                <div id="error" class="alert alert-danger d-none" role="alert"></div>
                
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                    Ingresar <i class="bi bi-box-arrow-in-right ms-2"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar si ya hay sesión activa
            const token = sessionStorage.getItem('token');
            if (token) {
                window.location.href = '/dashboard.html';
            }

            const loginForm = document.getElementById('loginForm');
            const errorDiv = document.getElementById('error');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                errorDiv.classList.add('d-none');
                
                try {
                    const result = await login(email, password);
                    
                    if (result.requires_change) {
                        sessionStorage.setItem('temp_token', result.token);
                        sessionStorage.removeItem('token');
                        window.location.href = '/cambiar-password.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                } catch (error) {
                    errorDiv.textContent = error.message || 'Error al iniciar sesión';
                    errorDiv.classList.remove('d-none');
                }
            });
        });
    </script>
</body>
</html>
