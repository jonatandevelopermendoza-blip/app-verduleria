<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Verdulería App</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style src="../static/css/dashboard.css"></style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Panel de Control</h1>
            <div class="nav">
                <a href="/dashboard.html">Inicio</a>
                <a href="/empleados.html">Empleados</a>
                <a href="/asistencias.html">Mis Asistencias</a>
                <a href="/stock.html">Stock</a>
                <a href="/ventas.html">Ventas</a>
                <a href="/horarios.html">Horarios</a><a href="#" id="reporteLink" style="display: none;">Reporte General</a>
                <a href="/finanzas.html">Finanzas</a>
                <a href="/sueldos.html">Sueldos</a>
                <a href="#" id="logoutBtn">Cerrar Sesión</a>
            </div>
        </div>
        <div class="content">
            <h2>Bienvenido, <span id="userName"></span></h2>
            <p>Rol: <span id="userRol"></span></p>
            
            <div class="stats" id="statsContainer">
                <!-- Estadísticas dinámicas -->
            </div>
            
            <div style="margin-bottom: 20px;">
                <button id="registrarBtn" class="success">Registrar Entrada/Salida</button>
                <div id="mensaje" class="alert" style="display: none; margin-top: 15px;"></div>
            </div>
            
            <div class="chart-container">
                <div class="chart-box">
                    <h3>Asistencias - Últimos 7 días</h3>
                    <canvas id="asistenciasChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>Empleados por Rol</h3>
                    <canvas id="rolesChart"></canvas>
                </div>
            </div>
            
            <div class="chart-box" style="margin-top: 20px;">
                <h3>Horas Trabajadas - Últimos 30 días</h3>
                <canvas id="horasChart"></canvas>
            </div>
        </div>
    </div>
    
    <script src="/js/api.js"></script>
    <script src="../static/js/dashboard.js"></script>
</body>
</html>
