<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Verdulería App{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="/css/styles.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Barra de navegación superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <button class="btn btn-dark d-lg-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <i class="bi bi-list"></i>
            </button>
            <a class="navbar-brand" href="/">🥬 Verdulería App</a>
            
            <div class="ms-auto">
                <div class="dropdown">
                    <button class="btn btn-dark dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span id="userNameNav">Usuario</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><span class="dropdown-item-text"><small>Rol: <span id="userRolNav"></span></small></span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" id="logoutBtnNav"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Escritorio -->
            <nav class="col-lg-2 d-none d-lg-block sidebar p-3 position-fixed" style="top: 56px; bottom: 0; overflow-y: auto;">
                {% include 'partials/sidebar.html' %}
            </nav>
            
            <!-- Sidebar Móvil (Offcanvas) -->
            <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title">Menú</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body">
                    {% include 'partials/sidebar.html' %}
                </div>
            </div>
            
            <!-- Contenido Principal -->
            <main class="col-lg-10 ms-auto px-4 py-4" style="margin-top: 56px;">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- api.js -->
    <script src="/js/api.js"></script>
    
    <!-- Script común -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const rol = getUserRol();
            const nombre = sessionStorage.getItem('userName') || 'Usuario';
            document.getElementById('userNameNav').textContent = nombre;
            document.getElementById('userRolNav').textContent = rol || '-';
            // Ocultar opciones del menú según el rol
            const userRol = getUserRol();
            if (userRol) {
                document.querySelectorAll('.menu-item, .menu-group').forEach(el => {
                    const rolesPermitidos = el.getAttribute('data-roles');
                    if (rolesPermitidos && !rolesPermitidos.split(',').includes(userRol)) {
                        el.style.display = 'none';
                    }
                });
            }
            
            document.getElementById('logoutBtnNav').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
